name: Build and Deploy Image
on: 
  release:
    types:  [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/Version da deployare (es: v1.0.0)'
        required: true
        type: string
      skip_deploy:
        description: 'Salta il deploy (solo build)'
        required: false
        type: boolean
        default: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: 
      contents: read
      packages: write
      id-token:  write
      security-events: write
    outputs:
      version:  ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name:  Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag exists
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🔍 Verifying tag: ${{ github.event.inputs.tag }}"
          
          # Fetch all tags
          git fetch --tags
          
          # Check if tag exists
          if ! git tag -l "${{ github.event.inputs.tag }}" | grep -q "^${{ github.event.inputs.tag }}$"; then
            echo "❌ ERROR: Tag '${{ github.event.inputs.tag }}' does not exist in the repository!"
            echo ""
            echo "Available tags (last 10):"
            git tag --sort=-version:refname | head -n 10
            echo ""
            echo "Please use an existing tag from the list above."
            exit 1
          fi
          
          echo "✅ Tag '${{ github.event.inputs.tag }}' exists and is valid"
          
          # Show tag details
          echo ""
          echo "Tag details:"
          git show ${{ github.event.inputs.tag }} --no-patch --format="%H - %s (%ci)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id:  build
        uses: docker/build-push-action@v5
        with:
          context: ./eddai_EliteDangerousApiInterface
          file: ./eddai_EliteDangerousApiInterface/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy security scan
        uses:  aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs. json).tags[0] }}
          format: 'sarif'
          output:  'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
  
  deploy:
    needs:  build
    runs-on: ubuntu-latest
    timeout-minutes:  15
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_deploy != 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with: 
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment..."
            echo "Version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main --rebase
            docker compose pull
            docker compose down
            docker compose up -d
            echo "Waiting for services to start..."
            sleep 10

      - name: Health check
        uses: appleboy/ssh-action@master
        with:
          host:  ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose ps
            echo "Checking if services are healthy..."
            if ! docker compose ps | grep -q "Up"; then
              echo "ERROR: Services are not running!"
              docker compose logs --tail=50
              exit 1
            fi
            echo "✓ Deployment successful - Version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || needs.build.outputs.version }}"
            echo "✓ Image digest: ${{ needs.build.outputs.image-digest }}"
            echo "✓ Trigger: ${{ github.event_name }}"