name: CI - Code Quality Checks

on:
  pull_request:
    branches: [ "*" ]
    paths:
      - 'eddai_EliteDangerousApiInterface/**'
      - '!eddai_EliteDangerousApiInterface/ed_frontend/**'
  push:
    branches: [ "main" ]
    paths:
      - 'eddai_EliteDangerousApiInterface/**'
      - '!eddai_EliteDangerousApiInterface/ed_frontend/**'

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    outputs:
      black-result: ${{ steps.black.outcome }}
      isort-result: ${{ steps.isort.outcome }}
      flake8-result: ${{ steps.flake8.outcome }}
      bandit-result: ${{ steps.bandit.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort bandit
      
      - name: Run Black (formatting check)
        id: black
        continue-on-error: true
        run: |
          black --check --diff eddai_EliteDangerousApiInterface/
      
      - name: Run isort (import sorting)
        id: isort
        continue-on-error: true
        run: |
          isort --check-only --diff eddai_EliteDangerousApiInterface/
      
      - name: Run Flake8 (linting)
        id: flake8
        continue-on-error: true
        run: |
          flake8 eddai_EliteDangerousApiInterface/ --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Run Bandit (security)
        id: bandit
        continue-on-error: true
        run: |
          bandit -r eddai_EliteDangerousApiInterface/ -f json -o bandit-report.json
      
      - name: Upload Bandit report
        if: always() && hashFiles('bandit-report.json') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bandit-security-report
          path: bandit-report.json

  summary:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - name: Publish results summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BLACK_RESULT: ${{ needs.lint.outputs.black-result }}
          ISORT_RESULT: ${{ needs.lint.outputs.isort-result }}
          FLAKE8_RESULT: ${{ needs.lint.outputs.flake8-result }}
          BANDIT_RESULT: ${{ needs.lint.outputs.bandit-result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '## Code quality results'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Black | ${BLACK_RESULT:-not run} |"
            echo "| isort | ${ISORT_RESULT:-not run} |"
            echo "| Flake8 | ${FLAKE8_RESULT:-not run} |"
            echo "| Bandit | ${BANDIT_RESULT:-not run} |"
            echo
            echo "[Workflow logs and Bandit report](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$LINT_RESULT" != 'success' ]; then
            echo 'Code quality job did not complete successfully.'
            exit 1
          fi