name: Release Helm Chart

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Update Chart.yaml
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i "s/^version: .*/version: ${VERSION}/" charts/eddai/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/eddai/Chart.yaml
          echo "Updated charts/eddai/Chart.yaml:"
          grep -E "^version:|^appVersion:" charts/eddai/Chart.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Lint chart
        run: |
          helm lint charts/eddai
          echo "✓ Chart lint passed"

      - name: Template test
        run: |
          helm template eddai charts/eddai --debug > /dev/null
          echo "✓ Template rendering passed"

      - name: Package chart
        run: |
          VERSION=${{ steps.version.outputs.version }}
          helm package charts/eddai --version ${VERSION}
          echo "✓ Chart packaged"
          ls -lh eddai-*.tgz

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update gh-pages branch
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CHART_FILE="eddai-${VERSION}.tgz"
          REPO_URL="https://github.com/fabietto01/EDDAI-EliteDangerousApiInterface/releases/download/v${VERSION}"
          
          # Save packaged chart to temp location before switching branches
          CHART_TMP="/tmp/${CHART_FILE}"
          cp "${CHART_FILE}" "${CHART_TMP}"
          
          # Stash local changes
          git stash --include-untracked || true
          
          # Try to fetch and checkout gh-pages, or create it
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
          
          # Create charts directory
          mkdir -p charts
          
          # Copy packaged chart from temp location
          cp "${CHART_TMP}" charts/
          
          # Create or update index
          if [ -f index.yaml ]; then
            helm repo index . --url "${REPO_URL}" --merge index.yaml
          else
            helm repo index . --url "${REPO_URL}"
          fi
          
          # Stage and commit
          git add charts/ index.yaml
          git status
          
          # Commit
          git commit -m "chore: release helm chart v${VERSION}" --allow-empty
          
          # Push
          git push origin gh-pages

      - name: Upload chart to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: eddai-${{ steps.version.outputs.version }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Helm Chart Released\n\nChart v${version} is now available:\n\n\`\`\`bash\nhelm repo add eddai https://fabietto01.github.io/EDDAI-EliteDangerousApiInterface/\nhelm repo update\nhelm install my-app eddai/eddai --version ${version}\n\`\`\`\n\n**Note:** GitHub Pages may take a few seconds to update.`
            })
        continue-on-error: true
