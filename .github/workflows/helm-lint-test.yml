name: Helm Lint & Template Test

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Helm Lint
        run: |
          helm lint charts/eddai
          echo "✓ Helm lint passed"

      - name: Template Rendering
        run: |
          helm template eddai charts/eddai \
            --namespace eddai \
            --values charts/eddai/values.yaml \
            > /tmp/manifests.yaml
          echo "✓ Template rendering passed"

      - name: Validate YAML
        run: |
          # Basic YAML validation using helm
          helm template eddai charts/eddai --debug 2>&1 | grep -i "error" && exit 1 || exit 0
          echo "✓ YAML validation passed"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Helm Chart Tests Passed**
              
              - ✓ Helm Lint
              - ✓ Template Rendering
              - ✓ YAML Validation
              
              The chart is ready for deployment.`
            })
        continue-on-error: true
