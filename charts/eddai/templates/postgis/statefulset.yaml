{{- if eq (include "eddai.postgis.deployInternal" .) "true" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "eddai.fullname" . }}-postgis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eddai.componentLabels" (dict "ctx" . "component" "postgis") | nindent 4 }}
spec:
  serviceName: {{ include "eddai.fullname" . }}-postgis
  replicas: 1
  selector:
    matchLabels:
      {{- include "eddai.selectorLabels" (dict "ctx" . "component" "postgis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eddai.componentLabels" (dict "ctx" . "component" "postgis") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "eddai.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.postgis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgis
          image: "{{ .Values.postgis.image.repository }}:{{ .Values.postgis.image.tag }}"
          imagePullPolicy: {{ .Values.postgis.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddai.postgis.secretName" . }}
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddai.postgis.secretName" . }}
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddai.postgis.secretName" . }}
                  key: database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgis
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgis.resources | nindent 12 }}
      {{- if not .Values.postgis.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["{{ .Values.postgis.persistence.accessMode }}"]
        {{- $sc := include "eddai.storageClass" (dict "local" .Values.postgis.persistence.storageClass "global" .Values.global.storageClass) }}
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgis.persistence.size }}
  {{- end }}
{{- end }}
