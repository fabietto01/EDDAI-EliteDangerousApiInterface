upstream eddai_EliteDangerousApiInterface {
    # In K8s replace with the Service name, e.g. "django-service:8080"
    server django:8080;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;
gzip_min_length 1024;

server {

    listen 80;

    # Lightweight probe for K8s liveness/readiness checks
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://eddai_EliteDangerousApiInterface;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Vue.js SPA bundle - baked into the image at build time.
    # Vite produces hashed filenames so assets can be cached indefinitely.
    location /static/vuejs/ {
        alias /app/vuejs/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Django collected statics (admin, DRF, GIS, ...).
    # In K8s: populate /app/django-static/ via an initContainer running
    # "python manage.py collectstatic --noinput".
    location /static/ {
        alias /app/django-static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # User-uploaded media - must be backed by a PersistentVolumeClaim in K8s.
    location /media/ {
        alias /app/media-server/;
    }

}
