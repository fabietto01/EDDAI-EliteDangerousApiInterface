x-common-config: &default-config
  pull_policy: always
  image: ghcr.io/fabietto01/eddai-elitedangerousapiinterface:latest
  environment:
  - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
  - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
  - DJANGO_EMAIL_HOST=${DJANGO_EMAIL_HOST}
  - DJANGO_EMAIL_HOST_USER=${DJANGO_EMAIL_HOST_USER}
  - DJANGO_DEFAULT_FROM_EMAIL=${DJANGO_DEFAULT_FROM_EMAIL}
  - DJANGO_EMAIL_HOST_PASSWORD=${DJANGO_EMAIL_HOST_PASSWORD}
  - DJANGO_EMAIL_PORT=${DJANGO_EMAIL_PORT}
  - DJANGO_CACHES_HOST=${DJANGO_CACHES_HOST}
  - DJANGO_CACHES_PORT=${DJANGO_CACHES_PORT}
  - CELERY_BROKER_HOST=${CELERY_BROKER_HOST}
  - CELERY_BROKER_USER=${CELERY_BROKER_USER}
  - CELERY_BROKER_PASSWORD=${CELERY_BROKER_PASSWORD}
  - CELERY_BROKER_VHOST=${CELERY_BROKER_VHOST}
  - CELERY_RESULT_BACKEND_HOST=${CELERY_RESULT_BACKEND_HOST}
  - CELERY_RESULT_BACKEND_PORT=${CELERY_RESULT_BACKEND_PORT}
  - EDDN_USER_NAME_AGENT=${EDDN_USER_NAME_AGENT}
  - EDDN_USER_PASSWORD_AGENT=${EDDN_USER_PASSWORD_AGENT}
  - POSTGIS_HOST=${POSTGIS_HOST}
  - POSTGIS_PORT=${POSTGIS_PORT}
  - POSTGIS_USER=${POSTGIS_USER}
  - POSTGIS_PASSWORD=${POSTGIS_PASSWORD}
  - POSTGIS_DB=${POSTGIS_DB}
  - LOKI_HOST=${LOKI_HOST}
  - LOKI_PORT=${LOKI_PORT}
  restart: always
  networks:
    - eddai

volumes:
  media_volume:

networks:
  eddai:
  proxy_net:
    external: true

services:
  django:
    <<: *default-config
    container_name: django
    command: python -m daphne eddai_EliteDangerousApiInterface.asgi:application -p 8080 -b 0.0.0.0
    volumes:
      - media_volume:/app/media-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz/').read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - celery_worker_task
      - celery_worker_admin
  celery_worker_task:
    <<: *default-config
    deploy:
      replicas: 3
    command: celery -A eddai_EliteDangerousApiInterface worker -l info -P gevent --autoscale 100,5 -Q default -n WorkerTask@%h
  celery_worker_admin:
    <<: *default-config
    deploy:
      replicas: 3
    command: celery -A eddai_EliteDangerousApiInterface worker -l info -P gevent --autoscale 100,5 -Q admin -n WorkerAdmin@%h
  celery_worker_ed_dbsync:
    <<: *default-config
    deploy:
      replicas: 3
    command: celery -A eddai_EliteDangerousApiInterface worker -l info -P gevent --autoscale 100,5 -Q ed_dbsync -n WorkerDBSync@%h
  celery_worker_all:
    <<: *default-config
    deploy:
      replicas: 3
    command: celery -A eddai_EliteDangerousApiInterface worker -l info -P gevent --autoscale 100,5 -Q admin,ed_dbsync,default -n WorkerAll@%h
  celery_beat:
    <<: *default-config
    container_name: celery_beat
    command: celery -A eddai_EliteDangerousApiInterface beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
  eddn:
    <<: *default-config
    container_name: eddn
    command: python eddn.py
    depends_on:
      - celery_worker_ed_dbsync
  frontend:
    pull_policy: always
    image: ${FRONTEND_IMAGE:-ghcr.io/fabietto01/eddai-elitedangerousapiinterface-frontend:latest}
    container_name: frontend
    restart: always
    environment:
      - DJANGO_UPSTREAM_HOST=django
      - DJANGO_UPSTREAM_PORT=8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      # Generato a runtime da envsubst (DJANGO_UPSTREAM_HOST/PORT): richiede scrittura anche a fs read-only.
      - /etc/nginx/conf.d:mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - media_volume:/usr/share/nginx/media:ro
    networks:
      - eddai
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      # Router per le richieste HTTP
      - "traefik.http.routers.frontend.rule=Host(`eddai.italiangamingsystem.it`)"
      - "traefik.http.routers.frontend.entrypoints=https"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=claudflare"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"