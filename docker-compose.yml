x-common-config: &default-config
  pull_policy: always
  image: ghcr.io/fabietto01/eddai-elitedangerousapiinterface:latest
  environment:
  - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
  - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-eddai_EliteDangerousApiInterface.settings.prod}
  - DJANGO_ALLOWED_HOSTS=${APP_HOST:-eddai.italiangamingsystem.it},localhost,127.0.0.1
  - DJANGO_CSRF_TRUSTED_ORIGINS=https://${APP_HOST:-eddai.italiangamingsystem.it}
  - DJANGO_EMAIL_HOST=${DJANGO_EMAIL_HOST}
  - DJANGO_EMAIL_HOST_USER=${DJANGO_EMAIL_HOST_USER}
  - DJANGO_DEFAULT_FROM_EMAIL=${DJANGO_DEFAULT_FROM_EMAIL}
  - DJANGO_EMAIL_HOST_PASSWORD=${DJANGO_EMAIL_HOST_PASSWORD}
  - DJANGO_EMAIL_PORT=${DJANGO_EMAIL_PORT}
  - DJANGO_CACHES_HOST=${DJANGO_CACHES_HOST}
  - DJANGO_CACHES_PORT=${DJANGO_CACHES_PORT}
  - CELERY_BROKER_HOST=${CELERY_BROKER_HOST}
  - CELERY_BROKER_USER=${CELERY_BROKER_USER}
  - CELERY_BROKER_PASSWORD=${CELERY_BROKER_PASSWORD}
  - CELERY_BROKER_VHOST=${CELERY_BROKER_VHOST}
  - CELERY_RESULT_BACKEND_HOST=${CELERY_RESULT_BACKEND_HOST}
  - CELERY_RESULT_BACKEND_PORT=${CELERY_RESULT_BACKEND_PORT}
  - EDDN_USER_NAME_AGENT=${EDDN_USER_NAME_AGENT}
  - EDDN_USER_PASSWORD_AGENT=${EDDN_USER_PASSWORD_AGENT}
  - POSTGIS_HOST=${POSTGIS_HOST}
  - POSTGIS_PORT=${POSTGIS_PORT}
  - POSTGIS_USER=${POSTGIS_USER}
  - POSTGIS_PASSWORD=${POSTGIS_PASSWORD}
  - POSTGIS_DB=${POSTGIS_DB}
  - LOKI_HOST=${LOKI_HOST}
  - LOKI_PORT=${LOKI_PORT}
  restart: always
  networks:
    - eddai

networks:
  eddai:
  proxy_net:
    external: true

volumes:
  static_volume:
  media_volume:

services:
  django:
    <<: *default-config
    container_name: django
    command: python -m daphne eddai_EliteDangerousApiInterface.asgi:application -p 8080 -b 0.0.0.0
    volumes:
      - static_volume:/app/static-server:ro
      - media_volume:/app/media-server
    networks:
      - eddai
      - proxy_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.eddai-backend.rule=Host(`${APP_HOST:-eddai.italiangamingsystem.it}`) && (Path(`/api`) || PathPrefix(`/api/`) || Path(`/admin`) || PathPrefix(`/admin/`) || Path(`/users`) || PathPrefix(`/users/`) || Path(`/healthz`) || PathPrefix(`/healthz/`))"
      - "traefik.http.routers.eddai-backend.priority=100"
      - "traefik.http.routers.eddai-backend.entrypoints=https"
      - "traefik.http.routers.eddai-backend.tls=true"
      - "traefik.http.routers.eddai-backend.tls.certresolver=claudflare"
      - "traefik.http.routers.eddai-backend.service=eddai-backend"
      - "traefik.http.services.eddai-backend.loadbalancer.server.port=8080"
  migrate:
    <<: *default-config
    profiles: [release]
    restart: "no"
    command:
      - bash
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput
    volumes:
      - static_volume:/app/static-server
  celery_worker_task:
    <<: *default-config
    deploy:
      replicas: 3
    command: celery -A eddai_EliteDangerousApiInterface worker -l info -P gevent --autoscale 100,5 -Q default -n WorkerTask@%h
  celery_worker_admin:
    <<: *default-config
    deploy:
      replicas: 3
    command: celery -A eddai_EliteDangerousApiInterface worker -l info -P gevent --autoscale 100,5 -Q admin -n WorkerAdmin@%h
  celery_worker_ed_dbsync:
    <<: *default-config
    deploy:
      replicas: 3
    command: celery -A eddai_EliteDangerousApiInterface worker -l info -P gevent --autoscale 100,5 -Q ed_dbsync -n WorkerDBSync@%h
  celery_worker_all:
    <<: *default-config
    deploy:
      replicas: 3
    command: celery -A eddai_EliteDangerousApiInterface worker -l info -P gevent --autoscale 100,5 -Q admin,ed_dbsync,default -n WorkerAll@%h
  celery_beat:
    <<: *default-config
    container_name: celery_beat
    command: celery -A eddai_EliteDangerousApiInterface beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
  eddn:
    <<: *default-config
    container_name: eddn
    command: python eddn.py
    depends_on:
      - celery_worker_ed_dbsync
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a frontend tag or digest}
    pull_policy: always
    build: ./eddai_EliteDangerousApiInterface/ed_frontend
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    volumes:
      - type: volume
        source: static_volume
        target: /app/static-server
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: media_volume
        target: /app/media-server
        read_only: true
        volume:
          nocopy: true
    networks:
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_net"
      - "traefik.http.routers.eddai-frontend.rule=Host(`${APP_HOST:-eddai.italiangamingsystem.it}`)"
      - "traefik.http.routers.eddai-frontend.priority=1"
      - "traefik.http.routers.eddai-frontend.entrypoints=https"
      - "traefik.http.routers.eddai-frontend.tls=true"
      - "traefik.http.routers.eddai-frontend.tls.certresolver=claudflare"
      - "traefik.http.routers.eddai-frontend.service=eddai-frontend"
      - "traefik.http.services.eddai-frontend.loadbalancer.server.port=8080"